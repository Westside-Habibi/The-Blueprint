<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Blueprint</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const OCEAN = "#0a4f6e";
const OCEAN_LIGHT = "#1a7fa0";
const GOLD = "#b8860b";
const GOLD_LIGHT = "#d4a017";
const SUCCESS = "#1a6b3a";
const PURPLE = "#5b3a7e";

const s = {
  app: { fontFamily: "Georgia, serif", background: "#f8f8f8", minHeight: "100vh", color: "#111" },
  hero: { background: "linear-gradient(160deg, #0a4f6e 0%, #062d3f 60%, #041e2a 100%)", color: "#fff", padding: "48px 20px 40px", textAlign: "center", position: "relative" },
  heroBar: { position: "absolute", bottom: 0, left: 0, right: 0, height: 4, background: `linear-gradient(90deg, ${GOLD}, ${GOLD_LIGHT}, ${GOLD})` },
  eyebrow: { fontFamily: "monospace", fontSize: 10, letterSpacing: 3, textTransform: "uppercase", color: GOLD_LIGHT, marginBottom: 12 },
  heroH1: { fontSize: 38, fontWeight: 300, lineHeight: 1.1, marginBottom: 10 },
  heroEm: { fontStyle: "italic", color: GOLD_LIGHT },
  heroSub: { fontSize: 15, fontWeight: 300, opacity: 0.75, fontStyle: "italic", marginBottom: 24 },
  heroBadge: { display: "inline-block", background: "rgba(201,151,58,0.15)", border: `1px solid ${GOLD}`, color: GOLD_LIGHT, fontFamily: "monospace", fontSize: 11, letterSpacing: 2, padding: "7px 16px", borderRadius: 2 },
  tabs: { display: "flex", background: "#fff", borderBottom: `2px solid #e0e0e0`, position: "sticky", top: 0, zIndex: 10 },
  tab: (active) => ({ flex: 1, padding: "14px 8px", textAlign: "center", fontFamily: "monospace", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", background: active ? "#fff" : "#f0f0f0", color: active ? OCEAN : "#888", borderBottom: active ? `3px solid ${OCEAN}` : "none", cursor: "pointer", fontWeight: active ? "bold" : "normal" }),
  container: { maxWidth: 720, margin: "0 auto", padding: "0 16px 48px" },
  sectionLabel: { fontFamily: "monospace", fontSize: 10, letterSpacing: 3, textTransform: "uppercase", color: OCEAN_LIGHT, marginBottom: 4, marginTop: 32 },
  sectionH2: { fontSize: 24, fontWeight: 400, color: OCEAN, marginBottom: 16, paddingBottom: 10, borderBottom: "1px solid #e0e0e0" },
  card: { background: "#fff", borderRadius: 10, padding: "18px 20px", marginBottom: 14, boxShadow: "0 2px 10px rgba(0,0,0,0.07)" },
  cardBorderLeft: (color) => ({ background: "#fff", borderLeft: `3px solid ${color}`, borderRadius: "0 8px 8px 0", padding: "18px 20px", marginBottom: 14, boxShadow: "0 2px 10px rgba(0,0,0,0.07)" }),
  scriptLabel: (color) => ({ fontFamily: "monospace", fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color, marginBottom: 8 }),
  scriptText: { fontSize: 15, fontStyle: "italic", color: "#111", lineHeight: 1.8, marginBottom: 10 },
  highlight: { background: "#fffbf0", border: `1px solid ${GOLD}`, borderRadius: 8, padding: "16px 20px", margin: "16px 0" },
  timelineWrap: { position: "relative", paddingLeft: 28 },
  timelineLine: { position: "absolute", left: 6, top: 8, bottom: 8, width: 2, background: `linear-gradient(to bottom, ${GOLD}, ${OCEAN_LIGHT})`, borderRadius: 2 },
  timelineItem: { position: "relative", marginBottom: 24 },
  timelineDot: (milestone) => ({ position: "absolute", left: milestone ? -26 : -24, top: 5, width: milestone ? 14 : 10, height: milestone ? 14 : 10, borderRadius: "50%", background: milestone ? OCEAN : GOLD, boxShadow: `0 0 0 2px ${milestone ? OCEAN : GOLD}`, border: "2px solid #f8f8f8" }),
  timelineDate: { fontFamily: "monospace", fontSize: 10, color: GOLD, letterSpacing: 1, marginBottom: 3 },
  timelineTitle: { fontSize: 18, fontWeight: 600, color: OCEAN, marginBottom: 6 },
  timelineBody: { fontSize: 15, color: "#222", lineHeight: 1.6 },
  checkRow: (done) => ({ display: "flex", alignItems: "flex-start", gap: 12, padding: "12px 0", borderBottom: "1px solid #e0e0e0", cursor: "pointer" }),
  checkBox: (done) => ({ width: 20, height: 20, minWidth: 20, borderRadius: 4, border: `1.5px solid ${done ? OCEAN : "#aaa"}`, background: done ? OCEAN : "#fff", display: "flex", alignItems: "center", justifyContent: "center", marginTop: 2, flexShrink: 0 }),
  checkText: (done) => ({ fontSize: 15, color: done ? "#888" : "#111", textDecoration: done ? "line-through" : "none", lineHeight: 1.5 }),
  progressBar: (pct) => ({ height: 6, borderRadius: 4, background: `linear-gradient(90deg, ${OCEAN}, ${GOLD})`, width: `${pct}%`, transition: "width 0.4s ease" }),
  resource: { display: "flex", gap: 14, alignItems: "flex-start", background: "#fff", borderRadius: 8, padding: "14px 16px", marginBottom: 10, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" },
  resourceName: { fontSize: 15, fontWeight: 600, color: OCEAN, marginBottom: 2 },
  resourceDetail: { fontSize: 13, color: "#555" },
  mantra: { background: "linear-gradient(135deg, #0a4f6e 0%, #062d3f 100%)", borderRadius: 12, padding: "28px 20px", textAlign: "center", margin: "32px 0" },
  mantraText: { fontSize: 20, fontWeight: 300, fontStyle: "italic", color: "#fff", lineHeight: 1.6, marginBottom: 12 },
  mantraCredit: { fontFamily: "monospace", fontSize: 10, letterSpacing: 2, color: GOLD_LIGHT },
  topicCard: (checked) => ({ background: "#fff", borderRadius: 10, padding: "18px 20px", marginBottom: 14, boxShadow: "0 2px 10px rgba(0,0,0,0.07)", cursor: "pointer", opacity: checked ? 0.65 : 1, borderLeft: checked ? `3px solid ${SUCCESS}` : "none" }),
  tag: (bg, color) => ({ display: "inline-block", fontFamily: "monospace", fontSize: 9, letterSpacing: 1, textTransform: "uppercase", padding: "3px 8px", borderRadius: 3, background: bg, color, marginBottom: 6 }),
  sayThis: { background: "#e8f4ff", borderLeft: `3px solid ${OCEAN_LIGHT}`, borderRadius: "0 6px 6px 0", padding: "12px 14px", marginTop: 10, fontStyle: "italic", fontSize: 14, color: "#0a2d40" },
  sayLabel: { fontFamily: "monospace", fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: OCEAN_LIGHT, marginBottom: 6, fontStyle: "normal" },
  reminderBox: { background: "linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 100%)", borderRadius: 12, padding: "28px 20px", textAlign: "center", margin: "28px 0" },
  reminderText: { fontSize: 17, fontWeight: 300, fontStyle: "italic", color: "#fff", lineHeight: 1.6, marginBottom: 10 },
  reminderCredit: { fontFamily: "monospace", fontSize: 10, letterSpacing: 2, color: GOLD_LIGHT },
  footer: { background: "#0a4f6e", color: "rgba(255,255,255,0.6)", textAlign: "center", padding: "24px 16px", fontFamily: "monospace", fontSize: 10, letterSpacing: 1 },
  divider: { border: "none", borderTop: "1px solid #e0e0e0", margin: "24px 0" },
};

const CHECKLIST = [
  { id: "c1", text: "This week — Call VA VASH case manager (same county, fast transfer)" },
  { id: "c2", text: "Wednesday June 18, 12pm — Therapist session: bring both documents" },
  { id: "c3", text: "Wednesday June 18, evening — Have the conversation with Nidia" },
  { id: "c4", text: "Thursday June 19 — Send Nidia follow-up text with all resources" },
  { id: "c5", text: "Thursday June 19 — Full honest conversation with landlord" },
  { id: "c6", text: "Late June — Kids leave for vacation, applications already submitted" },
  { id: "c7", text: "Late June/Early July — Lock in coastal 3-bedroom unit" },
  { id: "c8", text: "Mid July — Kids return to stability, your unit already locked in" },
  { id: "c9", text: "Next therapist session — Process how the conversation went" },
  { id: "c10", text: "August 1 — Move in. Breathe. Begin. 🌊" },
];

const TIMELINE = [
  { date: "THIS WEEK — JUNE 12–17", title: "One Call — VA VASH Case Manager Only", body: "Call your VA VASH case manager and let them know you're planning to transfer your voucher to a new 3-bedroom in the same county — Costa Mesa, Newport, or Huntington Beach — around August 1st. Same county means no portability process. Fast and simple. Landlord conversation waits until after Wednesday.", milestone: false },
  { date: "WEDNESDAY JUNE 18 — 12PM", title: "Therapist Session", body: "Bring The Blueprint and the Session Guide. Walk through everything. Get grounded, prepared, and ready. Role play the conversation. Leave with tools in hand.", milestone: true },
  { date: "WEDNESDAY JUNE 18 — EVENING", title: "The Conversation with Nidia", body: "Same day as therapy — while you're at your most grounded and prepared. Calm. Clear. Respectful. Use the script. That same evening she calls 211 and starts every assistance application simultaneously.", milestone: true },
  { date: "THURSDAY JUNE 19", title: "Follow-Up Text to Nidia + Landlord Conversation", body: "Send Nidia the follow-up text with all resource numbers. Then call your landlord with the full honest conversation — he hears it after Nidia, never before. Ask about 3-bed availability and request a grace period while assistance processes.", milestone: false },
  { date: "LATE JUNE — WHEN KIDS LEAVE", title: "Kids Leave for Vacation", body: "Hug them tight. Send them off with love. By this point the conversation has happened, applications are submitted, and the landlord is cooperative. Kids leave into a situation that's already being handled.", milestone: false },
  { date: "LATE JUNE — EARLY JULY", title: "Lock In Your New Unit", body: "Landlord finds your 3-bedroom in Costa Mesa, Newport, or Huntington Beach. VASH case manager does inspection. Same county means fast turnaround — 1 to 2 weeks.", milestone: false },
  { date: "MID JULY — KIDS RETURN", title: "Kids Come Home to Stability", body: "Nidia has applications submitted and processing. Landlord is cooperative. Your new unit is locked in. Kids come back to a mom who has a plan — not a mom in crisis.", milestone: false },
  { date: "AUGUST 1, 2026", title: "Move-In Day 🌊", body: "You move into your coastal 3-bedroom. Your son has his room. The ocean is close. You take that breath again — for real this time.", milestone: true },
  { date: "SEPTEMBER", title: "Stability Achieved", body: "Nidia's rental assistance kicks in. She is covered. Your son splits time between two homes — both stable, both loving. You are free and building.", milestone: false },
];

const TOPICS = [
  { id: "t1", num: "01", tag: ["#fff0e0", "#c97020", "The Decision"], title: "I Have Made a Decision — August 1st I'm Moving Out", body: "This is not a maybe. You have a plan, a date, a location, and a landlord who can help. You need your therapist to know this is happening so they can help you execute it — not keep processing whether you should.", say: '"I\'ve made my decision. I\'m moving out August 1st. I have a plan — VASH benefit, a landlord who is also a realtor, a coastal 3-bedroom in the Huntington/Newport/Costa Mesa area. I don\'t need help deciding anymore. I need help getting through the next 6 weeks without falling back into old patterns."' },
  { id: "t2", num: "02", tag: ["#ffe0e0", "#c03030", "The Anxiety"], title: "I'm Anxious About Nidia's Reaction — And I Already Know What It Will Be", body: "You know she'll be passive aggressive. You know the cycle — she fights it, then when you actually leave she becomes the person you originally fell in love with to win you back. Then once she has you, complacency returns. The anxiety isn't about the unknown. It's about holding firm when she becomes that person again.", say: '"My anxiety isn\'t about what she\'ll say. I already know — she\'ll be passive aggressive at first. What I\'m scared of is when she shifts and becomes the woman I fell in love with to pull me back. That\'s happened every time before. I need tools to stay the course when that happens — because that\'s the moment I\'ve always broken."' },
  { id: "t3", num: "03", tag: ["#f0e8ff", "#6b3fa0", "The Pattern"], title: "She Changes to Win — Then Gets Complacent Once She Has Me Back", body: "This is the cycle that has kept you trapped. She doesn't change because she's grown — she changes because it's a competition and you're the prize. Once she wins, the growth stops. You need your therapist to help you name this pattern clearly so when it shows up again you can see it for what it is.", say: '"There\'s a pattern I need help with. Every time I\'ve pulled away or left, she becomes the woman I originally fell in love with. Engaged, present, loving. And I come back. Then within months she\'s complacent again and I\'m invisible. I need to understand why I keep responding to that — and how to stop."' },
  { id: "t4", num: "04", tag: ["#ffe8e8", "#c03030", "The Fear"], title: "I'm Scared I'll End Up Alone", body: "Even with clarity about what needs to happen, there's a quiet fear underneath all of it that you'll leave and end up with nothing. This fear is what keeps people in situations they've outgrown. It needs to be spoken out loud — not managed around.", say: '"Underneath all of this there\'s a fear I haven\'t said out loud much — that I\'ll leave and end up alone. That I\'ll lose everything familiar and have nothing. I know logically that\'s not true but it\'s there and it\'s been part of why I\'ve stayed. I want to work through where that fear comes from."' },
  { id: "t5", num: "05", tag: ["#ffe8f5", "#a0306b", "Giselle"], title: "There Is Someone Else — And I Still Love Her", body: "In 2018 you met someone named Giselle who showed you what real love feels like. Nidia broke that up through guilt. Giselle is currently in a relationship but a month ago you both confirmed the feelings are still mutual. You're afraid you missed your chance. Your therapist should know the full picture.", say: '"There\'s someone I need to talk about. In 2018 I met a woman named Giselle who genuinely showed me what love is supposed to feel like. Nidia pulled me back through guilt and I lost that relationship. Giselle and I still have feelings for each other — we confirmed that about a month ago. She\'s in a relationship now and I\'m scared I\'ve missed my chance. This isn\'t why I\'m leaving — but I need to work through the guilt and fear around it."' },
  { id: "t6", num: "06", tag: ["#e0f0ff", "#1a5fa0", "The Conversation"], title: "Help Me Prepare For The Conversation With Nidia", body: "You need practical tools for the actual conversation — not just emotional support. How to stay calm when she escalates. What to do when she cries or gets passive aggressive. How to not get pulled into defending your decision. Ask to role play it.", say: '"I need practical help preparing for the conversation with Nidia. Can we actually role play it? I want to practice staying calm when she escalates, not defending my decision over and over, and knowing when to end the conversation if it goes in circles. I know what I want to say — I just need to practice holding my ground when it gets hard."' },
];

function Blueprint({ checks, toggle }) {
  const done = Object.values(checks).filter(Boolean).length;
  const pct = (done / CHECKLIST.length) * 100;

  return (
    <div>
      <div style={s.container}>
        {/* Overview */}
        <div style={s.sectionLabel}>The Big Picture</div>
        <div style={s.sectionH2}>What You're Building</div>
        <div style={s.highlight}>
          <p style={{ fontSize: 15, color: "#111" }}>You have <strong style={{ color: OCEAN }}>stable income</strong>, an <strong style={{ color: OCEAN }}>approved VASH voucher</strong> for a 3-bedroom, a <strong style={{ color: OCEAN }}>lenient landlord</strong> who is also a realtor, a <strong style={{ color: OCEAN }}>therapist in your corner</strong>, and a family that has <strong style={{ color: OCEAN }}>real assistance options</strong>. Everything is in place.</p>
        </div>

        {/* Timeline */}
        <div style={s.sectionLabel}>Phase by Phase</div>
        <div style={{ ...s.sectionH2 }}>The Timeline</div>
        <div style={s.timelineWrap}>
          <div style={s.timelineLine} />
          {TIMELINE.map((item, i) => (
            <div key={i} style={s.timelineItem}>
              <div style={s.timelineDot(item.milestone)} />
              <div style={s.timelineDate}>{item.date}</div>
              <div style={s.timelineTitle}>{item.title}</div>
              <div style={s.timelineBody}>{item.body}</div>
            </div>
          ))}
        </div>

        <hr style={s.divider} />

        {/* VASH Script */}
        <div style={s.sectionLabel}>Call 1 — This Week</div>
        <div style={s.sectionH2}>Your VA VASH Case Manager</div>
        <div style={s.cardBorderLeft(GOLD)}>
          <div style={s.scriptLabel(GOLD)}>📞 What To Say</div>
          <p style={s.scriptText}>"Hi, this is [your name]. I'm currently on the VASH program and I've been approved for a 3-bedroom voucher. I'm going through a separation and need to transfer my voucher to a new unit. I'm looking in the Costa Mesa, Newport Beach, or Huntington Beach area — same county. I'm planning to move around August 1st. What do I need to do to start that process?"</p>
        </div>

        <hr style={s.divider} />

        {/* Landlord Script */}
        <div style={s.sectionLabel}>Call 2 — After Wednesday</div>
        <div style={s.sectionH2}>Your Landlord</div>
        <p style={{ fontSize: 15, color: "#333", marginBottom: 14 }}>Tell him everything at once — one honest conversation on Thursday June 19th, after Nidia has already heard it from you.</p>
        <div style={s.cardBorderLeft(GOLD)}>
          <div style={s.scriptLabel(GOLD)}>📞 One Honest Conversation</div>
          <p style={s.scriptText}>"Hey, I wanted to talk to you about something important. My wife and I are separating. I'm planning to move out around August 1st and I want to find a 3-bedroom through my VASH benefit in the Costa Mesa, Newport, or Huntington area. I'd love to stay in your portfolio if you have something available."</p>
          <p style={s.scriptText}>"My wife will be staying in the current unit with our son. She's going to be applying for rental assistance immediately — 211, City of Orange assistance, South County Outreach. The approval process takes about 4–8 weeks. I'm asking if you'd be willing to give her a grace period while that assistance processes. She's not disappearing — she's actively applying from day one."</p>
          <p style={s.scriptText}>"You'd essentially be keeping both of us as tenants. I'm a guaranteed VASH payment and she'll have assistance coming. I wanted to be completely straight with you so there are no surprises."</p>
        </div>

        <hr style={s.divider} />

        {/* Therapist */}
        <div style={s.sectionLabel}>Wednesday June 18 — 12PM Then Evening</div>
        <div style={s.sectionH2}>Your Therapist → Then Nidia</div>
        <div style={s.cardBorderLeft(SUCCESS)}>
          <div style={s.scriptLabel(SUCCESS)}>💬 Session at 12PM — Prepare</div>
          <p style={s.scriptText}>"I've made a decision. I'm moving out August 1st. I've mapped out the finances, the resources for my wife, the full timeline. I have the conversation with her planned for tonight. I need help preparing emotionally so I can stay calm and firm without it turning into a fight. Can we role play it?"</p>
        </div>
        <div style={s.cardBorderLeft(SUCCESS)}>
          <div style={s.scriptLabel(SUCCESS)}>💬 Next Session — Process</div>
          <p style={s.scriptText}>"I had the conversation with Nidia. Here's how it went — [share what happened]. I need help processing this and staying grounded through the next 6 weeks without second-guessing myself."</p>
        </div>

        <hr style={s.divider} />

        {/* Nidia Scripts */}
        <div style={s.sectionLabel}>Wednesday Evening</div>
        <div style={s.sectionH2}>What To Say To Nidia</div>
        {[
          { label: "🗣️ Opening", text: '"I need to have an honest conversation with you. I\'m saying this with respect for everything we\'ve been through and the family we built together."' },
          { label: "🗣️ The Decision", text: '"I\'ve made the decision to move out. I know this isn\'t easy to hear. But I think deep down we both know this marriage hasn\'t been working for either of us for a long time. I\'m not doing this out of anger. I\'m doing this because staying in something that isn\'t working isn\'t fair to either of us."' },
          { label: "🗣️ About the Kids", text: '"Our kids are everything to me. Especially our son. I will always be present for him — I\'m finding a place with his own room so he has a real home with me too. This changes our address, not my commitment to our children."' },
          { label: "🗣️ About the Finances", text: '"I know your first worry is going to be rent. I\'ve already researched this for you. There are real programs available right now in Orange County. I need you to call 211 today — they\'ll connect you to everything. City of Orange rental assistance, South County Outreach which accepts applications every month, and OCHA emergency assistance up to $10,000. You qualify as a single mother with a minor child."' },
          { label: "🗣️ What You Need From Her", text: '"What I need from you is to start looking for work. Even part time. Not for me — for yourself and for our kids. The assistance programs are a bridge. You are capable of more than this situation has asked of you."' },
          { label: "🗣️ Closing", text: '"I\'m giving us both until August 1st — that\'s 6 weeks. I\'m not disappearing overnight. I want this transition to be responsible for everyone. I\'ll follow up with all the resource information in writing."' },
        ].map((item, i) => (
          <div key={i} style={s.cardBorderLeft(OCEAN)}>
            <div style={s.scriptLabel(OCEAN)}>{item.label}</div>
            <p style={s.scriptText}>{item.text}</p>
          </div>
        ))}

        <hr style={s.divider} />

        {/* Follow up text */}
        <div style={s.sectionLabel}>Thursday June 19</div>
        <div style={s.sectionH2}>Follow-Up Text to Nidia</div>
        <div style={s.cardBorderLeft(GOLD)}>
          <div style={s.scriptLabel(GOLD)}>📱 Text Message</div>
          <p style={s.scriptText}>"As I mentioned, I want to make sure you have everything you need. Here are the resources for rental assistance in Orange County:</p>
          <p style={s.scriptText}>📞 Call 211 first — they'll connect you to everything available right now</p>
          <p style={s.scriptText}>🏠 City of Orange Rental Assistance — just overhauled, newly accessible. Call the City of Orange Housing Division.</p>
          <p style={s.scriptText}>🏠 South County Outreach — applies monthly between the 25th–10th. sco-oc.org</p>
          <p style={s.scriptText}>🏠 OCHA Emergency Rental Assistance — up to $10,000 per household. ochousing.org | 714-480-2777</p>
          <p style={s.scriptText}>When you apply tell them: single mother, minor child in home, sudden loss of housing subsidy, no current income. That profile gets prioritized.</p>
          <p style={s.scriptText}>I'll always be here for the kids. This is just us choosing honesty."</p>
        </div>

        <hr style={s.divider} />

        {/* Resources */}
        <div style={s.sectionLabel}>Her Safety Net</div>
        <div style={s.sectionH2}>Nidia's Resource Map</div>
        {[
          { icon: "📞", name: "211 Orange County", detail: "Call or text 211 — free, 24/7. Connects to every available program in real time. First call she makes." },
          { icon: "🏠", name: "City of Orange Rental Assistance", detail: "Just overhauled May 2026 with easier eligibility. Call City of Orange Housing Division directly." },
          { icon: "🏠", name: "South County Outreach", detail: "Applications accepted 25th–10th every month. Rental and utility assistance. sco-oc.org" },
          { icon: "💰", name: "OCHA Emergency Rental Assistance", detail: "Up to $10,000 per eligible household. ochousing.org | 714-480-2777" },
          { icon: "📋", name: "OCHA Section 8 Waitlist Alerts", detail: "Sign up at affordablehousingonline.com for instant notification when OC waitlist reopens." },
        ].map((r, i) => (
          <div key={i} style={s.resource}>
            <span style={{ fontSize: 22 }}>{r.icon}</span>
            <div>
              <div style={s.resourceName}>{r.name}</div>
              <div style={s.resourceDetail}>{r.detail}</div>
            </div>
          </div>
        ))}

        <hr style={s.divider} />

        {/* Numbers */}
        <div style={s.sectionLabel}>Your Financial Reality</div>
        <div style={s.sectionH2}>The Numbers</div>
        {[
          ["VA Compensation Income", "$5,390/month"],
          ["Your rent with VASH (3-bed)", "~$525–600/month"],
          ["All fixed expenses", "~$1,412/month"],
          ["Money remaining after expenses", "~$3,378/month"],
          ["Monthly savings potential", "$1,500–2,000+"],
        ].map(([label, val], i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #e0e0e0", fontSize: 15 }}>
            <span style={{ color: "#333" }}>{label}</span>
            <strong style={{ color: OCEAN }}>{val}</strong>
          </div>
        ))}
        <div style={{ ...s.highlight, marginTop: 16 }}>
          <p style={{ fontSize: 15, color: "#111" }}>You are not financially trapped. You have been <strong style={{ color: OCEAN }}>emotionally trapped</strong> — which made the finances feel impossible. The numbers work. Now use them for yourself.</p>
        </div>

        <hr style={s.divider} />

        {/* Checklist */}
        <div style={s.sectionLabel}>Action Items</div>
        <div style={s.sectionH2}>Master Checklist</div>
        <p style={{ fontSize: 12, color: "#888", fontFamily: "monospace", marginBottom: 14 }}>Tap each item to check it off.</p>

        <div style={{ background: "#fff", borderRadius: 10, padding: "4px 16px 8px", boxShadow: "0 2px 10px rgba(0,0,0,0.07)", marginBottom: 16 }}>
          {CHECKLIST.map((item) => (
            <div key={item.id} style={s.checkRow(checks[item.id])} onClick={() => toggle(item.id)}>
              <div style={s.checkBox(checks[item.id])}>
                {checks[item.id] && <span style={{ color: "#fff", fontSize: 12, fontWeight: "bold" }}>✓</span>}
              </div>
              <span style={s.checkText(checks[item.id])}>{item.text}</span>
            </div>
          ))}
        </div>

        <div style={{ background: "#fff", borderRadius: 10, padding: "16px 20px", boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontFamily: "monospace", fontSize: 11, color: "#888", letterSpacing: 1 }}>PROGRESS</span>
            <span style={{ fontFamily: "monospace", fontSize: 11, color: GOLD }}>{done} / {CHECKLIST.length}</span>
          </div>
          <div style={{ background: "#e0e0e0", borderRadius: 4, height: 6, overflow: "hidden" }}>
            <div style={s.progressBar(pct)} />
          </div>
        </div>

        <div style={s.mantra}>
          <p style={s.mantraText}>"You are not abandoning your family.<br />You are choosing to become whole —<br />so you can actually be present for them."</p>
          <div style={s.mantraCredit}>SANTA MONICA SHORE · JUNE 2016 → AUGUST 2026</div>
        </div>
      </div>
    </div>
  );
}

function TherapyPrep({ topicChecks, toggleTopic }) {
  const done = Object.values(topicChecks).filter(Boolean).length;
  const pct = (done / TOPICS.length) * 100;

  return (
    <div>
      <div style={s.container}>
        <p style={{ fontSize: 15, color: "#333", marginTop: 24, marginBottom: 8 }}>Six topics — each with exactly what to say. Tap each as you cover it in session.</p>

        {/* Progress */}
        <div style={{ background: "#fff", borderRadius: 10, padding: "16px 20px", boxShadow: "0 2px 8px rgba(0,0,0,0.06)", marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontFamily: "monospace", fontSize: 11, color: "#888", letterSpacing: 1 }}>TOPICS COVERED</span>
            <span style={{ fontFamily: "monospace", fontSize: 11, color: GOLD }}>{done} / {TOPICS.length}</span>
          </div>
          <div style={{ background: "#e0e0e0", borderRadius: 4, height: 6, overflow: "hidden" }}>
            <div style={{ ...s.progressBar(pct), background: `linear-gradient(90deg, ${PURPLE}, ${OCEAN})` }} />
          </div>
        </div>

        {TOPICS.map((topic) => (
          <div key={topic.id} style={s.topicCard(topicChecks[topic.id])} onClick={() => toggleTopic(topic.id)}>
            <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
              <div style={{ ...s.checkBox(topicChecks[topic.id]), marginTop: 4 }}>
                {topicChecks[topic.id] && <span style={{ color: "#fff", fontSize: 12, fontWeight: "bold" }}>✓</span>}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "monospace", fontSize: 10, color: GOLD, letterSpacing: 2, marginBottom: 3 }}>TOPIC {topic.num}</div>
                <div style={s.tag(topic.tag[0], topic.tag[1])}>{topic.tag[2]}</div>
                <div style={{ fontSize: 17, fontWeight: 600, color: OCEAN, marginBottom: 8, lineHeight: 1.3, textDecoration: topicChecks[topic.id] ? "line-through" : "none" }}>{topic.title}</div>
                <div style={{ fontSize: 14, color: "#333", lineHeight: 1.6, marginBottom: 10 }}>{topic.body}</div>
                <div style={s.sayThis}>
                  <div style={s.sayLabel}>Say This</div>
                  {topic.say}
                </div>
              </div>
            </div>
          </div>
        ))}

        <div style={s.reminderBox}>
          <p style={s.reminderText}>"You are not going to therapy to get permission to leave.</p>
          <p style={s.reminderText}>You are going to get strong enough to follow through."</p>
          <div style={s.reminderCredit}>WEDNESDAY JUNE 18, 2026 · 12PM</div>
        </div>

        {/* What NOT to do */}
        <div style={s.sectionLabel}>Just As Important</div>
        <div style={s.sectionH2}>What NOT To Do In This Session</div>
        <div style={s.card}>
          {[
            ["Don't let the session become about whether you should leave.", "That decision is made. If the conversation drifts there — redirect: \"I'm not here to decide. I'm here to prepare.\""],
            ["Don't spend the whole session on Nidia's feelings.", "This session is about yours. Her reaction is hers to manage."],
            ["Don't leave without one specific tool.", "Something concrete you can use when you feel yourself wavering — a phrase, an anchor, a physical reminder. Ask for it directly."],
          ].map(([title, body], i) => (
            <div key={i} style={{ paddingBottom: 12, marginBottom: 12, borderBottom: i < 2 ? "1px solid #e0e0e0" : "none" }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: OCEAN, marginBottom: 4 }}>{title}</div>
              <div style={{ fontSize: 14, color: "#333" }}>{body}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState(0);
  const [checks, setChecks] = useState({});
  const [topicChecks, setTopicChecks] = useState({});

  useEffect(() => {
    try {
      const b = JSON.parse(localStorage.getItem("bp_checks") || "{}");
      const t = JSON.parse(localStorage.getItem("bp_topics") || "{}");
      setChecks(b);
      setTopicChecks(t);
    } catch (e) {}
  }, []);

  const toggle = (id) => {
    const next = { ...checks, [id]: !checks[id] };
    setChecks(next);
    try { localStorage.setItem("bp_checks", JSON.stringify(next)); } catch (e) {}
  };

  const toggleTopic = (id) => {
    const next = { ...topicChecks, [id]: !topicChecks[id] };
    setTopicChecks(next);
    try { localStorage.setItem("bp_topics", JSON.stringify(next)); } catch (e) {}
  };

  return (
    <div style={s.app}>
      <div style={s.hero}>
        <div style={s.heroBar} />
        <div style={s.eyebrow}>{tab === 0 ? "Your Personal Roadmap" : "Therapy Session Prep"}</div>
        <h1 style={s.heroH1}>
          {tab === 0 ? <><em style={s.heroEm}>The</em><br />Blueprint</> : <><em style={s.heroEm}>Wednesday</em><br />Session Guide</>}
        </h1>
        <p style={s.heroSub}>{tab === 0 ? "From where you are — to where you belong" : "Therapist at 12pm. Nidia conversation that evening."}</p>
        <div style={s.heroBadge}>{tab === 0 ? "AUGUST 1, 2026 · MOVE-IN DAY" : "WEDNESDAY JUNE 18, 2026 · 12PM"}</div>
      </div>

      <div style={s.tabs}>
        <div style={s.tab(tab === 0)} onClick={() => setTab(0)}>📋 The Blueprint</div>
        <div style={s.tab(tab === 1)} onClick={() => setTab(1)}>🧠 Session Guide</div>
      </div>

      {tab === 0 ? <Blueprint checks={checks} toggle={toggle} /> : <TherapyPrep topicChecks={topicChecks} toggleTopic={toggleTopic} />}

      <div style={s.footer}>
        Built for you · <span style={{ color: GOLD_LIGHT }}>The Blueprint</span> · August 1, 2026
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
