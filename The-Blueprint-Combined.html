  <!-- CALL 1: VA VASH -->
  <div class="section">
    <div class="section-label">Call 1 — This Week</div>
    <h2>Your VA VASH Case Manager</h2>
    <p style="font-size:16px; font-weight:300; margin-bottom:16px;">Keep it short. You&apos;re just starting the process. They handle this regularly.</p>

    <div class="script-card gold-border">
      <div class="script-label">📞 What To Say</div>
      <p>"Hi, this is [your name]. I&apos;m currently on the VASH program and I&apos;ve been approved for a 3-bedroom voucher. I&apos;m going through a separation and I need to transfer my voucher to a new unit. I&apos;m looking in the Costa Mesa, Newport Beach, or Huntington Beach area. I&apos;m planning to move around August 1st. What do I need to do to start that process?"</p>
    </div>

    <ul class="steps">
      <li><span class="step-num">01</span> Ask about the voucher portability process to a new unit</li>
      <li><span class="step-num">02</span> Ask what the inspection timeline looks like</li>
      <li><span class="step-num">03</span> Ask if there&apos;s anything you need to submit before finding a unit</li>
      <li><span class="step-num">04</span> Get their direct number for follow-ups</li>
    </ul>
  </div>

  <hr class="divider">

  <!-- CALL 2: LANDLORD -->
  <div class="section">
    <div class="section-label">Call 2 — This Week</div>
    <h2>Your Landlord</h2>
    <p style="font-size:16px; font-weight:300; margin-bottom:16px;">Tell him everything at once — one honest conversation. He&apos;s going to connect the dots anyway and he needs the full picture to work with you. Honesty here builds the trust you need for this plan to work.</p>

    <div class="script-card gold-border">
      <div class="script-label">📞 One Honest Conversation — Tell Him Everything</div>
      <p>"Hey, I wanted to talk to you about something important. My wife and I are separating. I&apos;m planning to move out around August 1st and I want to find a 3-bedroom through my VASH benefit in the Costa Mesa, Newport, or Huntington area. I&apos;d love to stay in your portfolio if you have something available."</p>
      <p>"My wife will be staying in the current unit with our son. She&apos;s going to be applying for rental assistance immediately — 211, City of Orange assistance, South County Outreach. The approval process takes about 4–8 weeks. I&apos;m asking if you&apos;d be willing to give her a grace period while that assistance processes. She&apos;s not disappearing — she&apos;s actively applying from day one."</p>
      <p>"You&apos;d essentially be keeping both of us as tenants. I&apos;m a guaranteed VASH payment and she&apos;ll have assistance coming. I wanted to be completely straight with you so there are no surprises."</p>
    </div>

    <div class="highlight">
      <p><strong>Key point:</strong> A lenient landlord who keeps you as a reliable VASH tenant AND keeps Nidia while assistance processes is keeping <strong>two long-term tenants</strong> instead of losing one. That is directly in his financial interest — and he&apos;ll see that immediately.</p>
    </div>
  </div>

  <hr class="divider">

  <!-- CALL 3: THERAPIST -->
  <div class="section">
    <div class="section-label">Two Sessions — Perfect Timing</div>
    <h2>Your Therapist</h2>
    <p style="font-size:16px; font-weight:300; margin-bottom:16px;">You couldn&apos;t have planned this better. You have support <em>before</em> the conversation and <em>after</em> it. Use both intentionally.</p>

    <div class="script-card green-border">
      <div class="script-label">💬 Wednesday June 18th — Prepare for the Conversation</div>
      <p>"I&apos;ve made a decision. I&apos;m moving out on August 1st. I&apos;ve mapped out the finances, the resources for my wife, the full timeline — everything. I have a date set to have the conversation with her on June 16th. I need help preparing emotionally so I can stay calm and firm without it turning into a fight. Can we work through that together?"</p>
    </div>

    <ul class="steps">
      <li><span class="step-num">01</span> Walk them through the full plan — finances, timeline, landlord, resources</li>
      <li><span class="step-num">02</span> Ask them to help you anticipate her reactions and how to stay grounded</li>
      <li><span class="step-num">03</span> Work through the guilt — separate responsibility from guilt</li>
      <li><span class="step-num">04</span> Ask for tools to stay calm if emotions escalate in the room</li>
    </ul>

    <div class="script-card green-border" style="margin-top:20px">
      <div class="script-label">💬 Next Session After the Conversation</div>
      <p>"I had the conversation with Nidia on June 16th. Here&apos;s how it went — [share what happened]. I need help processing this and staying grounded through the next 6 weeks of transition without second-guessing myself."</p>
    </div>

    <ul class="steps">
      <li><span class="step-num">01</span> Process how the conversation went — emotions, her reaction, how you felt</li>
      <li><span class="step-num">02</span> Address any guilt that came up after the conversation</li>
      <li><span class="step-num">03</span> Build a plan for staying emotionally steady through July</li>
      <li><span class="step-num">04</span> Talk about what August 1st and the new chapter means to you</li>
    </ul>
  </div>

  <!-- THE CONVERSATION: NIDIA -->
  <div class="section">
    <div class="section-label">June 16 — The Most Important Conversation</div>
    <h2>What To Say To Nidia</h2>
    <p style="font-size:16px; font-weight:300; margin-bottom:16px;">In person. Calm. Not a fight — a statement. You are not asking for permission. You are informing her of a decision you&apos;ve made, respectfully and with care for her wellbeing.</p>

    <div class="script-card">
      <div class="script-label">🗣️ Opening</div>
      <p>"I need to have an honest conversation with you. I&apos;m saying this with respect for everything we&apos;ve been through and the family we built together."</p>
    </div>

    <div class="script-card">
      <div class="script-label">🗣️ The Decision</div>
      <p>"I&apos;ve made the decision to move out. I know this isn&apos;t easy to hear. But I think deep down we both know this marriage hasn&apos;t been working for either of us for a long time. I&apos;m not doing this out of anger. I&apos;m doing this because staying in something that isn&apos;t working isn&apos;t fair to either of us."</p>
    </div>

    <div class="script-card">
      <div class="script-label">🗣️ About the Kids</div>
      <p>"Our kids are everything to me. Especially our son. I will always be present for him — I&apos;m finding a place with his own room so he has a real home with me too. This changes our address, not my commitment to our children."</p>
    </div>

    <div class="script-card gold-border">
      <div class="script-label">🗣️ About the Finances — The Most Important Part</div>
      <p>"I know your first worry is going to be rent. I&apos;ve already researched this for you. There are real programs available right now in Orange County that can help. I need you to call 211 today — they&apos;ll connect you to everything. There&apos;s also the City of Orange rental assistance program, South County Outreach which accepts applications every month, and OCHA emergency assistance up to $10,000. You qualify as a single mother with a minor child. That profile gets prioritized."</p>
    </div>

    <div class="script-card">
      <div class="script-label">🗣️ What You Need From Her</div>
      <p>"What I need from you is to start looking for work. Even part time. Not for me — for yourself and for our kids. The assistance programs are a bridge. You are capable of more than this situation has asked of you."</p>
    </div>

    <div class="script-card">
      <div class="script-label">🗣️ The Closing</div>
      <p>"I&apos;m giving us both until August 1st — that&apos;s 6 weeks. I&apos;m not disappearing overnight. I want this transition to be responsible for everyone. I&apos;ll follow up with all the resource information in writing so you have it."</p>
    </div>

  <!-- FOLLOW UP TEXT -->
  <div class="section">
    <div class="section-label">After the Conversation</div>
    <h2>Follow-Up Text to Nidia</h2>
    <p style="font-size:16px; font-weight:300; margin-bottom:16px;">Send this the same day or the morning after. She needs the resources in writing.</p>

    <div class="script-card gold-border">
      <div class="script-label">📱 Text Message</div>
      <p>"As I mentioned, I want to make sure you have everything you need. Here are the resources for rental assistance in Orange County:</p>
      <p>📞 Call 211 first — they&apos;ll connect you to everything available right now</p>

          <p>This is the cycle that has kept you trapped. She doesn&apos;t change because she&apos;s grown — she changes because it&apos;s a competition and you&apos;re the prize. Once she wins, the growth stops. You end up back where you started — invisible, unheard, carrying everything.</p>
          <p>You need your therapist to help you name this pattern clearly so that when it shows up again you can see it for what it is — not love returning, but a familiar strategy.</p>
          <div class="say-this">
            <div class="say-label">Say This</div>
            "There&apos;s a pattern I need help with. Every time I&apos;ve pulled away or left, she becomes the woman I originally fell in love with. Engaged, present, loving. And I come back. Then within months she&apos;s complacent again and I&apos;m invisible again. I need to understand why I keep responding to that — and how to stop."
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOPIC 4 -->
  <div class="topic-card" data-tid="t4" onclick="toggleTopic(this)">
    <div class="topic-header">
      <div class="topic-check" id="t4"></div>
      <div class="topic-meta">
        <div class="topic-number">TOPIC 04</div>
        <div class="tag tag-fear">The Fear</div>
        <div class="topic-title">I&apos;m Scared I&apos;ll End Up Alone</div>
        <div class="topic-body">
          <p>Even knowing what you know — even with clarity about what needs to happen — there&apos;s a quiet fear underneath all of it that you&apos;ll leave and end up with nothing. No partner. No one. Just alone.</p>
          <p>This fear is what keeps people in situations they&apos;ve outgrown. It needs to be spoken out loud — not managed around.</p>
          <div class="say-this">
            <div class="say-label">Say This</div>
            "Underneath all of this there&apos;s a fear I haven&apos;t said out loud much — that I&apos;ll leave and end up alone. That I&apos;ll lose everything familiar and have nothing. I know logically that&apos;s not true but it&apos;s there and it&apos;s been part of why I&apos;ve stayed. I want to work through where that fear comes from."
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOPIC 5 -->
  <div class="topic-card" data-tid="t5" onclick="toggleTopic(this)">
    <div class="topic-header">
      <div class="topic-check" id="t5"></div>
      <div class="topic-meta">
        <div class="topic-number">TOPIC 05</div>
        <div class="tag tag-heart">Giselle</div>
        <div class="topic-title">There Is Someone Else — And I Still Love Her</div>
        <div class="topic-body">
          <p>In 2018 you met someone named Giselle who showed you what real love actually feels like. Nidia broke that up through guilt. Giselle is currently in a relationship but a month ago you both confirmed the feelings are still mutual. You&apos;re afraid you missed your chance — and afraid you&apos;ll lose both.</p>
          <p>This isn&apos;t the main reason you&apos;re leaving — but it&apos;s real and it&apos;s part of the picture. Your therapist should know.</p>
          <div class="say-this">
            <div class="say-label">Say This</div>
            "There&apos;s someone I need to talk about. In 2018 I met a woman named Giselle who genuinely showed me what love is supposed to feel like. Nidia pulled me back through guilt and I lost that relationship. Giselle and I still have feelings for each other — we confirmed that about a month ago. She&apos;s in a relationship now and I&apos;m scared I&apos;ve missed my chance. This isn&apos;t why I&apos;m leaving — but I need to work through the guilt and the fear around it."
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOPIC 6 -->
  <div class="topic-card" data-tid="t6" onclick="toggleTopic(this)">
    <div class="topic-header">
      <div class="topic-check" id="t6"></div>
      <div class="topic-meta">
        <div class="topic-number">TOPIC 06</div>
        <div class="tag tag-anxiety">The Conversation</div>
        <div class="topic-title">Help Me Prepare For The Conversation With Nidia</div>
        <div class="topic-body">
          <p>You need practical tools for the actual conversation — not just emotional support. How to stay calm when she escalates. What to do when she cries or gets passive aggressive. How to not get pulled into defending your decision. How to end the conversation if it goes sideways.</p>
          <div class="say-this">
            <div class="say-label">Say This</div>
            "I need practical help preparing for the conversation with Nidia — not just emotional support. Can we actually role play it? I want to practice staying calm when she escalates, not defending my decision over and over, and knowing when to end the conversation if it goes in circles. I know what I want to say — I just need to practice holding my ground when it gets hard."
          </div>
        </div>
      </div>
    </div>
  </div>

  <hr class="divider">

  <!-- REMINDER BOX -->
  <div class="reminder-box">
    <p>"You are not going to therapy to get permission to leave.</p>
    <p>You are going to get strong enough to follow through."</p>
    <span class="reminder-credit">WEDNESDAY JUNE 18, 2026</span>
  </div>

  <hr class="divider">

  <!-- WHAT NOT TO DO -->
  <div class="section">
    <div class="section-label">Just As Important</div>
    <h2>What NOT To Do In This Session</h2>

    <div class="topic-card" style="cursor:default;">
      <div class="topic-body">
        <p><strong style="color:var(--ocean);">Don&apos;t let the session become about whether you should leave.</strong> That decision is made. If the conversation drifts there — redirect it: "I&apos;m not here to decide. I&apos;m here to prepare."</p>
        <p><strong style="color:var(--ocean);">Don&apos;t spend the whole session on Nidia&apos;s feelings.</strong> This session is about yours. Her reaction is hers to manage. Your job is staying grounded.</p>
        <p><strong style="color:var(--ocean);">Don&apos;t leave without asking for one specific tool.</strong> Something concrete you can use in the moment when you feel yourself wavering — a phrase, an anchor, a physical reminder. Ask for it directly.</p>
      </div>
    </div>
  </div>

</div>

<script>
  const saved = JSON.parse(localStorage.getItem(&apos;therapyChecks&apos;) || &apos;{}&apos;);

  function updateProgress() {
    const total = 6;
    const done = document.querySelectorAll(&apos;.topic-card.checked&apos;).length;
    document.getElementById(&apos;therapyProgress&apos;).textContent = done + &apos; / &apos; + total;
    document.getElementById(&apos;therapyBar&apos;).style.width = (done / total * 100) + &apos;%&apos;;
  }

  // Apply saved state
  Object.keys(saved).forEach(id => {
    if (saved[id]) {
      const card = document.querySelector(&apos;[data-tid="&apos; + id + &apos;"]&apos;);
      const check = document.getElementById(id);
      if (card && check) {
        card.classList.add(&apos;checked&apos;);
        check.classList.add(&apos;checked&apos;);
      }
    }
  });

  updateProgress();

  function toggleTopic(card) {
    const tid = card.dataset.tid;
    const check = document.getElementById(tid);
    const isChecked = card.classList.toggle(&apos;checked&apos;);
    if (isChecked) {
      check.classList.add(&apos;checked&apos;);
    } else {
      check.classList.remove(&apos;checked&apos;);
    }
    saved[tid] = isChecked;
    localStorage.setItem(&apos;therapyChecks&apos;, JSON.stringify(saved));
    updateProgress();
  }
</script>
